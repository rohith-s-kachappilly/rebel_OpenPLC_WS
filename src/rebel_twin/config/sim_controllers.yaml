/sim/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: position_controllers/JointGroupPositionController

/sim/arm_position_controller:
  ros__parameters:
    joints:
      - rebel_1_joint1
      - rebel_1_joint2
      - rebel_1_joint3
      - rebel_1_joint4
